[package]
name = "esp32-pir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "esp32-pir"
path = "src/main.rs"

[dependencies]
# 版本基线：2026-06 在 ESP32-C3 SuperMini 上实测过的组合
# （esp-hal ~1.1 / esp-radio 0.18 / esp-rtos 0.3 / smoltcp 0.13），
# 不要单独升级其中一个，成套升级，升级前先查对应版本的文档。
esp-hal = { version = "~1.1.0", features = ["esp32c3", "unstable"] }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-println = { version = "0.17.0", features = ["esp32c3"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c3",
  # 注意：0.18 已删除 `smoltcp` feature，esp-radio 不再直接实现
  # smoltcp 的 Device trait。net.rs 里用 Interface::receive/transmit
  # 的 token API 自己包了一层 WifiDevice（见 net.rs 的适配注释）。
  "unstable",
  "wifi",
] }
# 注意：不要开 "embassy" feature，那是给异步用的，这个模板不用
esp-rtos = { version = "0.3.0", features = ["esp-alloc", "esp-radio", "esp32c3"] }
# 只用来把 esp-radio 0.18 的 connect_async() 在阻塞代码里跑完
# （0.18 没有同步 connect）；主循环本身仍是阻塞式的，不用 Embassy 任务
embassy-futures = "0.1"
# raw smoltcp 0.13，阻塞用胶水；不要和 blocking-network-stack 混用
# （那个小包是按旧版 smoltcp 写的，版本对不上）
smoltcp = { version = "0.13.0", default-features = false, features = [
  "medium-ethernet",
  "proto-dhcpv4",
  "proto-ipv4",
  "socket-dhcpv4",
  # UDP 和 TCP 两套都留着，切换只改 net.rs 里的 TRANSPORT
  "socket-tcp",
  "socket-udp",
] }

[profile.dev]
# 调试档默认太慢太大，嵌入式上总要开一点优化
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
